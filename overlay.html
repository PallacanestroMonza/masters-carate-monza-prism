<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAysJGD5jBnTEPY1lSlvk9yRfTXtyVZHwU",
  authDomain: "tabellone-monza-agrate-3f7a1.firebaseapp.com",
  databaseURL: "https://tabellone-monza-agrate-3f7a1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tabellone-monza-agrate-3f7a1",
  storageBucket: "tabellone-monza-agrate-3f7a1.firebasestorage.app",
  messagingSenderId: "1065515511910",
  appId: "1:1065515511910:web:c2939024b149145b4dbda7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref('scoreboards/masters-carate-monza/live');
let state = {homeScore:0,awayScore:0,homeFouls:0,awayFouls:0,homeTimeouts:0,awayTimeouts:0,period:1,clock:600,running:false,startedAt:null};
let serverOffset = 0;

db.ref('.info/serverTimeOffset').on('value', s => serverOffset = s.val() || 0);
ref.on('value', snap => { if (snap.exists()) state = {...state, ...snap.val()}; render(); });

function nowServer(){ return Date.now() + serverOffset; }
function remainingSeconds(){
  let r = Number(state.clock ?? 600);
  if(state.running && state.startedAt){ r -= Math.floor((nowServer() - state.startedAt)/1000); }
  return Math.max(0, r);
}
function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function periodLabel(p){ return p <= 4 ? `${p}° QUARTO` : `OT ${p-4}`; }
function render(){
  document.getElementById('homeScore').textContent = state.homeScore ?? 0;
  document.getElementById('awayScore').textContent = state.awayScore ?? 0;
  document.getElementById('homeFouls').textContent = state.homeFouls ?? 0;
  document.getElementById('awayFouls').textContent = state.awayFouls ?? 0;
  document.getElementById('homeTimeouts').textContent = state.homeTimeouts ?? 0;
  document.getElementById('awayTimeouts').textContent = state.awayTimeouts ?? 0;
  document.getElementById('period').textContent = periodLabel(Number(state.period || 1));
  const rem = remainingSeconds();
  document.getElementById('clock').textContent = fmt(rem);
  document.getElementById('status').textContent = state.running && rem > 0 ? 'IN CORSO' : 'IN PAUSA';
}
setInterval(render, 200);
render();
</script>
